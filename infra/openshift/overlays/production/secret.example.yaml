# Copy to secret.yaml (git-ignored), replace CHANGE_ME with a password that differs from
# staging's, then: oc apply -f secret.yaml. Not part of the kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-app
  namespace: tutors-ai-production
type: Opaque
stringData:
  username: tutors_ai
  password: CHANGE_ME
  database: tutors_ai
  url: postgresql://tutors_ai:CHANGE_ME@postgres:5432/tutors_ai
---
# Only once a tool server needs a token: one key per server listed in the tool-servers ConfigMap,
# MCP_TOKEN_<NAME>. The API refuses to start on a key that names no listed server.
apiVersion: v1
kind: Secret
metadata:
  name: tool-server-tokens
  namespace: tutors-ai-production
type: Opaque
stringData:
  MCP_TOKEN_GLOSSARY: CHANGE_ME
