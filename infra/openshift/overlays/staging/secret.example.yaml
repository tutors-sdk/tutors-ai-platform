# Copy to secret.yaml (git-ignored), replace CHANGE_ME, then: oc apply -f secret.yaml
# Not part of the kustomization, so `oc apply -k` never touches it.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-app
  namespace: tutors-ai-staging
type: Opaque
stringData:
  username: tutors_ai
  password: CHANGE_ME
  database: tutors_ai
  url: postgresql://tutors_ai:CHANGE_ME@postgres:5432/tutors_ai
