# The nightly insights run (apps/insights-worker): reads evidence, writes insights. It never talks
# to the model server, and the network policies do not let it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: insights-worker
  labels:
    app.kubernetes.io/name: insights-worker
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: insights-worker
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: insights-worker
              # Tag set per overlay; never latest.
              image: quay.io/tutors-sdk/tutors-ai-insights-worker
              env:
                - name: PG_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-app
                      key: url
                - name: COURSE_EXPORT_DIR
                  value: /course-exports
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://otel-collector:4318
                - name: EVIDENCE_SOURCE
                  value: insights-worker
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: course-exports
                  mountPath: /course-exports
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: course-exports
              persistentVolumeClaim:
                claimName: course-exports
                readOnly: true
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
