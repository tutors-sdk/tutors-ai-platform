# Ingress isolation. Everything is denied, then exactly three flows are allowed:
#   inference-api                  -> ollama:11434
#   inference-api, insights-worker -> postgres:5432
#   inference-api, insights-worker -> otel-collector:4318
# Nothing reaches inference-api itself (and there is no Route) until authentication lands
# (ADR 0005). Peers are pod selectors without a namespaceSelector, so they match only pods in
# this namespace: staging cannot reach production and the reverse. CI checks the ollama rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inference-api-to-ollama
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: inference-api
      ports:
        - protocol: TCP
          port: 11434
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: inference-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: insights-worker
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: inference-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: insights-worker
      ports:
        - protocol: TCP
          port: 4318
