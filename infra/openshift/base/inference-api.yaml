# The inference API (apps/inference-api). ClusterIP only: authentication is deferred (ADR 0005),
# so nothing outside the namespace may reach it and there is no Route or Ingress. CI enforces both.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  labels:
    app.kubernetes.io/name: inference-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference-api
          # Tag set per overlay (images: in kustomization.yaml); never latest.
          image: quay.io/tutors-sdk/tutors-ai-inference-api
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-pin
                  key: OLLAMA_MODEL
            - name: OLLAMA_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: model-pin
                  key: OLLAMA_DIGEST
            - name: PG_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: url
            - name: COURSE_EXPORT_DIR
              value: /course-exports
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: EVIDENCE_SOURCE
              value: inference-api
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: course-exports
              mountPath: /course-exports
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: course-exports
          persistentVolumeClaim:
            claimName: course-exports
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
  labels:
    app.kubernetes.io/name: inference-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inference-api
  ports:
    - name: http
      port: 8080
      targetPort: http
