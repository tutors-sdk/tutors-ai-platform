# Everything one environment needs, namespace-agnostic. Overlays set the namespace, image tags
# and sizes. The Secrets `postgres-app` and `tool-server-tokens` are deliberately not listed: they
# are applied by hand from the overlay's secret.example.yaml so no credential is ever committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: tutors-ai-platform
    includeTemplates: true

resources:
  - model-pin.yaml
  - tool-servers.yaml
  - course-exports.yaml
  - inference-api.yaml
  - insights-worker.yaml
  - ollama.yaml
  - postgres.yaml
  - otel-collector.yaml
  - observability.yaml
  - network-policies.yaml
