name: Nightly quality

# What a pull request cannot afford to run: properties at 10,000 runs, the suite in random order
# three times with no retries, a 200,000-request soak and the full mutation run. A failure keeps
# one issue, "Nightly quality failing", open until a night passes. See docs/testing.md.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  properties:
    name: Properties at 10,000 runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A failure prints the seed and path; replay with FC_SEED=... FC_PATH=... pnpm test:properties.
      - run: pnpm test:properties

  shuffled:
    name: Unit suite in random order (${{ matrix.round }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run with a fresh seed and no retries
        run: |
          seed=$(( (RANDOM << 15) | RANDOM ))
          echo "Order seed: $seed (replay: pnpm vitest run --project unit --sequence.shuffle --sequence.seed=$seed)" | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm vitest run --project unit --sequence.shuffle --sequence.seed="$seed" --retry=0

  soak:
    name: Heap soak (200,000 requests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:soak
        env:
          SOAK_REQUESTS: 200000

  mutation:
    name: Mutation (every package in the baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation:fixture
      - run: pnpm mutation
      - run: node scripts/check-mutation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-mutation-report
          path: |
            packages/core/reports/mutation/
            packages/adapters/resilience/reports/mutation/
            packages/adapters/ollama/reports/mutation/
            packages/adapters/mcp/reports/mutation/

  report:
    name: Keep the nightly issue up to date
    runs-on: ubuntu-latest
    needs: [properties, shuffled, soak, mutation]
    if: always() && github.event_name == 'schedule'
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close "Nightly quality failing"
        run: |
          title="Nightly quality failing"
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "- \(.key): \(.value.result)"')
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$failed" ]; then
            body=$(printf 'The nightly run failed:\n\n%s\n\nRun: %s\n\nReplay commands are in each job log and in docs/testing.md.' "$failed" "$RUN_URL")
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"
            else gh issue create --title "$title" --body "$body"; fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Passed again: $RUN_URL"
          fi
