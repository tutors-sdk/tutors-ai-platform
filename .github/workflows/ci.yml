name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, EARS gate, unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm ears
      - run: pnpm test --project unit

  mutation:
    name: Mutation score (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation
      - run: node scripts/check-mutation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/core/reports/mutation/

  integration:
    name: Adapter integration (Ollama CPU model, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:0.12.3
        ports:
          - 11434:11434
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      OLLAMA_URL: http://localhost:11434
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      OLLAMA_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull the CI model and resolve its digest
        run: |
          for i in $(seq 1 30); do curl -sf "$OLLAMA_URL/api/version" && break; sleep 2; done
          curl -sf "$OLLAMA_URL/api/pull" -d "{\"model\":\"$OLLAMA_MODEL\",\"stream\":false}"
          digest=$(curl -sf "$OLLAMA_URL/api/tags" | jq -r --arg m "$OLLAMA_MODEL" '.models[] | select(.name == $m) | .digest')
          test -n "$digest"
          echo "OLLAMA_DIGEST=sha256:$digest" >> "$GITHUB_ENV"
          echo "CI model $OLLAMA_MODEL is sha256:$digest"
      - run: pnpm test:integration

  image:
    name: Container image (inference-api)
    runs-on: ubuntu-latest
    needs: [check]
    env:
      IMAGE: quay.io/tutors-sdk/inference-api
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: podman build -f apps/inference-api/Containerfile -t "$IMAGE:${GITHUB_SHA::12}" .
      - name: Smoke test the image starts and refuses bad config
        run: |
          set +e
          out=$(podman run --rm "$IMAGE:${GITHUB_SHA::12}" 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "is required"
      - name: Push (main only, when registry credentials are configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.QUAY_USERNAME != ''
        run: |
          echo "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin
          podman push "$IMAGE:${GITHUB_SHA::12}"
          podman tag "$IMAGE:${GITHUB_SHA::12}" "$IMAGE:main"
          podman push "$IMAGE:main"
