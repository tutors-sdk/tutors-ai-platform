name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, EARS gate, unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm ears
      - run: pnpm test --project unit

  mutation:
    name: Mutation score (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation
      - run: node scripts/check-mutation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/core/reports/mutation/

  integration:
    name: Adapter integration (Ollama CPU model, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      ollama:
        image:
    name: Container image (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [check]
    strategy:
      matrix:
        app: [inference-api, insights-worker]
    env:
      IMAGE: quay.io/tutors-sdk/tutors-ai-${{ matrix.app }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: podman build -f "apps/${{ matrix.app }}/Containerfile" -t "$IMAGE:sha-${GITHUB_SHA::12}" .
      - name: Smoke test the image starts and refuses missing config
        run: |
          set +e
          out=$(podman run --rm "$IMAGE:sha-${GITHUB_SHA::12}" 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "is required"
      - name: Push (main only, when registry credentials are configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.QUAY_USERNAME != ''
        run: |
          echo "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin
          podman push "$IMAGE:sha-${GITHUB_SHA::12}"
          podman tag "$IMAGE:sha-${GITHUB_SHA::12}" "$IMAGE:main"
          podman push "$IMAGE:main"
