name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A release tag (v0.1.0) publishes the image tag the production overlay promotes (0.1.0).
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lints, ratchets, EARS gate, unit, property and fault tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchets compare with the base: HEAD^1 is the base tip of a pull request's merge
          # commit, and the previous commit on a push.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:suite-health
      - run: pnpm lint:determinism
      - run: pnpm ratchets
        env:
          RATCHET_BASE_REF: HEAD^1
      - run: pnpm ears
      # Unit tests include the model-based properties (100 runs each), the Ollama fault catalogue
      # and its self-test, and the lints' negative fixtures.
      - run: pnpm test --project unit

  soak:
    name: Heap soak (10,000 requests, planted leak must be caught)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:soak
        env:
          SOAK_REQUESTS: 10000

  mutation:
    name: Mutation score (core, resilience, Ollama, MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # First prove the gate can still go red: the known-weak fixture must keep survivors.
      - run: pnpm mutation:fixture
      - run: pnpm mutation
      - run: node scripts/check-mutation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            packages/core/reports/mutation/
            packages/adapters/resilience/reports/mutation/
            packages/adapters/ollama/reports/mutation/
            packages/adapters/mcp/reports/mutation/

  integration:
    name: Adapter integration (Ollama CPU model, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:0.12.3
        ports:
          - 11434:11434
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      OLLAMA_URL: http://localhost:11434
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      OLLAMA_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull the CI model and resolve its digest
        run: |
          for i in $(seq 1 30); do curl -sf "$OLLAMA_URL/api/version" && break; sleep 2; done
          curl -sf "$OLLAMA_URL/api/pull" -d "{\"model\":\"$OLLAMA_MODEL\",\"stream\":false}"
          digest=$(curl -sf "$OLLAMA_URL/api/tags" | jq -r --arg m "$OLLAMA_MODEL" '.models[] | select(.name == $m) | .digest')
          test -n "$digest"
          echo "OLLAMA_DIGEST=sha256:$digest" >> "$GITHUB_ENV"
          echo "CI model $OLLAMA_MODEL is sha256:$digest"
      - run: pnpm test:integration

  image:
    name: Container image (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [check]
    strategy:
      matrix:
        app: [inference-api, insights-worker]
    env:
      # quay.io/<QUAY_ORG>/tutors-ai-<app>. QUAY_ORG is a repository variable; it defaults to the
      # organisation the OpenShift overlays name, so change both together.
      IMAGE: quay.io/${{ vars.QUAY_ORG || 'tutors-sdk' }}/tutors-ai-${{ matrix.app }}
      # A quay.io robot account with write access to the two repositories.
      QUAY_ROBOT_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          version=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          podman build -f "apps/${{ matrix.app }}/Containerfile" \
            --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" \
            -t "$IMAGE:sha-${GITHUB_SHA::12}" .
      - name: Smoke test the image starts and refuses missing config
        run: |
          set +e
          out=$(podman run --rm "$IMAGE:sha-${GITHUB_SHA::12}" 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "is required"
      - name: Push (main and release tags only, when registry credentials are configured)
        if: github.event_name == 'push' && env.QUAY_ROBOT_USERNAME != ''
        run: |
          echo "$QUAY_ROBOT_TOKEN" | podman login quay.io -u "$QUAY_ROBOT_USERNAME" --password-stdin
          podman push "$IMAGE:sha-${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="${GITHUB_REF_NAME#v}"; else tag=main; fi
          podman tag "$IMAGE:sha-${GITHUB_SHA::12}" "$IMAGE:$tag"
          podman push "$IMAGE:$tag"
          echo "Pushed $IMAGE:sha-${GITHUB_SHA::12} and $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Note that nothing was pushed
        if: github.event_name == 'push' && env.QUAY_ROBOT_USERNAME == ''
        run: echo "Built but not pushed; set the QUAY_ROBOT_USERNAME and QUAY_ROBOT_TOKEN secrets to publish." >> "$GITHUB_STEP_SUMMARY"

  compose:
    name: Whole platform in containers (compose.yaml)
    runs-on: ubuntu-latest
    needs: [check]
    env:
      OLLAMA_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The local collector config matches the cluster's
        run: |
          python3 - <<'PY'
          import sys
          cluster = open('infra/openshift/base/otel-collector.yaml').read().split('config.yaml: |\n')[1].split('\n---')[0]
          cluster = [line[4:] for line in cluster.splitlines()]
          local = [line for line in open('infra/compose/otel-collector.yaml').read().splitlines() if not line.startswith('#')]
          if [l for l in cluster if l.strip()] != [l for l in local if l.strip()]:
              sys.exit('infra/compose/otel-collector.yaml differs from the ConfigMap in infra/openshift/base/otel-collector.yaml')
          PY
      - name: Start the stack
        run: scripts/dev-up.sh
      - name: Ask a question through the API
        run: |
          curl -sf --max-time 180 http://127.0.0.1:8080/v0/assist -H 'content-type: application/json' -d '{
            "contractVersion": "0.1.0",
            "learner": {"learnerId": "ci-learner", "sessionId": "ci-session", "courseId": "full-stack-1",
                        "labId": "lab-01-loops", "level": "first-year", "memory": {"kind": "session", "sharing": "private"}},
            "question": "Why does my while loop never end?"
          }' | tee assist.json
          node -e 'const b = JSON.parse(require("fs").readFileSync("assist.json", "utf8")); if (!["answered", "refused"].includes(b.kind)) process.exit(1)'
      - name: Run the insights worker once
        run: docker compose run --rm insights-worker
      - name: The collector received the API's spans
        run: |
          for _ in $(seq 1 15); do
            docker compose logs otel-collector | grep -q '"spans"' && exit 0
            sleep 2
          done
          docker compose logs otel-collector
          exit 1
      # Takes Ollama, then PostgreSQL, away and checks the API fails fast, recovers and survives.
      - name: Chaos (scripts/chaos.sh)
        run: |
          docker compose up -d --no-deps inference-api
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8080/readyz >/dev/null && break; sleep 2; done
          scripts/chaos.sh
        env:
          MODEL_CIRCUIT_FAILURES: 2
          MODEL_CIRCUIT_RESET_MS: 5000
      - name: Logs
        if: always()
        run: docker compose logs --no-color

  infra:
    name: Infrastructure (kustomize, kubeconform, conftest, terraform)
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: 5.4.3
      KUBECONFORM_VERSION: 0.6.7
      CONFTEST_VERSION: 0.56.0
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Install kustomize, kubeconform and conftest
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/bin" kustomize
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP/bin" conftest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Staging (strict) and Terraform
        run: infra/ci/check.sh staging
      # Once production is pinned, drop --expect-unpinned; check.sh fails if it is left in.
      - name: Production (every policy but the model pin, which must still be UNPINNED)
        run: infra/ci/check.sh --skip-terraform --expect-unpinned production

  # The one check branch protection needs: it fails unless every job above succeeded.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [check, soak, mutation, integration, image, compose, infra]
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
